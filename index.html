<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Controle | Sucroenergético</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header"><i class="ph-fill ph-tractor"></i><h2>Controle</h2></div>
        <nav>
            <button class="nav-button active" data-view="dashboard"><i class="ph-fill ph-chart-pie-slice"></i><span>Dashboard</span></button>
            <button class="nav-button" data-view="controle"><i class="ph-fill ph-arrows-clockwise"></i><span>Painel de Controle</span></button>
            <button class="nav-button" data-view="relatorios"><i class="ph-fill ph-chart-bar"></i><span>Relatórios</span></button>
            <div class="nav-group">
                <button class="nav-button-group"><i class="ph-fill ph-database"></i><span>Cadastros</span><i class="ph ph-caret-down caret"></i></button>
                <div class="submenu">
                    <button class="nav-button" data-view="cadastro-fazendas"><i class="ph-fill ph-tree-evergreen"></i><span>Fazendas</span></button>
                    <button class="nav-button" data-view="cadastro-caminhoes"><i class="ph-fill ph-truck"></i><span>Caminhões</span></button>
                    <button class="nav-button" data-view="cadastro-equipamentos"><i class="ph-fill ph-tractor"></i><span>Equipamentos</span></button>
                    <button class="nav-button" data-view="cadastro-frentes"><i class="ph-fill ph-users-three"></i><span>Frentes</span></button>
                    <button class="nav-button" data-view="cadastro-fornecedores"><i class="ph-fill ph-user-list"></i><span>Fornecedores</span></button>
                    <button class="nav-button" data-view="cadastro-proprietarios"><i class="ph-fill ph-user-circle"></i><span>Proprietários</span></button>
                    <button class="nav-button" data-view="cadastro-terceiros"><i class="ph-fill ph-user"></i><span>Terceiros</span></button>
                </div>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <div id="dashboard-view" class="view active-view"></div>
        <div id="controle-view" class="view"></div>
        <div id="relatorios-view" class="view"></div>
        <div id="cadastro-fazendas-view" class="view"></div>
        <div id="cadastro-caminhoes-view" class="view"></div>
        <div id="cadastro-equipamentos-view" class="view"></div>
        <div id="cadastro-frentes-view" class="view"></div>
        <div id="cadastro-fornecedores-view" class="view"></div>
        <div id="cadastro-proprietarios-view" class="view"></div>
        <div id="cadastro-terceiros-view" class="view"></div>
    </main>

    <div id="toast-container"></div>
    
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Editar Item</h2>
                <button id="modal-close-btn" class="close-btn"><i class="ph-fill ph-x"></i></button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
