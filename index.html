<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Controle | Sucroenergético</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="ph-fill ph-tractor"></i>
            <h2>Controle</h2>
        </div>
        <nav>
            <button class="nav-button active" data-view="dashboard">
                <i class="ph-fill ph-chart-pie-slice"></i>
                <span>Dashboard</span>
            </button>
            <button class="nav-button" data-view="controle">
                <i class="ph-fill ph-arrows-clockwise"></i>
                <span>Painel de Controle</span>
            </button>
            <button class="nav-button" data-view="cadastros">
                <i class="ph-fill ph-database"></i>
                <span>Cadastros</span>
            </button>
        </nav>
    </aside>

    <main class="main-content">
        <div id="dashboard-view" class="view active-view">
            <div class="dashboard-overlay">
                <div class="kpi-card"><h2 id="kpi-caminhoes-ativos">0</h2><p>Caminhões Ativos</p></div>
                <div class="kpi-card"><h2 id="kpi-caminhoes-inativos">0</h2><p>Caminhões Inativos</p></div>
                <div class="kpi-card"><h2 id="kpi-fazendas-colhendo">0</h2><p>Fazendas em Colheita</p></div>
                <div class="kpi-card"><h2 id="kpi-frentes-ativas">0</h2><p>Frentes Ativas</p></div>
            </div>
            <div id="map"></div>
        </div>

        <div id="controle-view" class="view">
            <div class="admin-container">
                <h1>Painel de Controle de Operações</h1>
                <div class="form-section full-width">
                    <h3><i class="ph ph-game-controller"></i> Ações em Tempo Real</h3>
                    <div class="logistica-controls">
                        <div class="control-group"><label>Atualizar Status da Fazenda</label><select id="select-fazenda-status"></select><select id="fazenda-novo-status"><option value="colhendo">Colhendo</option><option value="inativa">Inativa</option></select><button id="btn-update-fazenda">Atualizar</button></div>
                        <div class="control-group"><label>Atualizar Status do Caminhão</label><select id="select-caminhao-status"></select><select id="caminhao-novo-status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option><option value="em_viagem">Em Viagem</option></select><button id="btn-update-caminhao">Atualizar</button></div>
                        <div class="control-group"><label>Designar Frente para Fazenda</label><select id="select-frente-designar"></select><select id="select-fazenda-designar"></select><button id="btn-designar-frente">Designar</button></div>
                        <div class="control-group"><label>Posicionar Caminhão na Fazenda</label><select id="select-caminhao-posicionar"></select><select id="select-fazenda-posicionar"></select><button id="btn-posicionar-caminhao">Posicionar</button></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="cadastros-view" class="view">
            <div class="admin-container">
                <h1>Cadastros Gerais</h1>
                <div class="admin-grid">
                    <div class="form-section">
                        <h3><i class="ph ph-tree-evergreen"></i> Cadastro de Fazendas</h3>
                        <form id="form-fazenda">
                            <input type="text" id="fazenda-nome" placeholder="Nome da Fazenda" required>
                            <p class="map-label">Clique no mapa para definir a localização:</p>
                            <div id="map-cadastro"></div>
                            <div class="coords"><input type="text" id="fazenda-lat" placeholder="Latitude" readonly required><input type="text" id="fazenda-lon" placeholder="Longitude" readonly required></div>
                            <button type="submit">Salvar Fazenda</button>
                        </form>
                        <div class="list-container" id="lista-fazendas"></div>
                    </div>
                    
                    <div class="form-section">
                        <h3><i class="ph ph-truck"></i> Cadastro de Caminhões</h3>
                        <form id="form-caminhao">
                            <input type="text" id="caminhao-placa" placeholder="Placa do Veículo" required>
                            <input type="text" id="caminhao-codigo" placeholder="Código do Equipamento">
                            <input type="text" id="caminhao-motorista" placeholder="Motorista do Horário">
                            <button type="submit">Salvar Caminhão</button>
                        </form>
                        <div class="list-container" id="lista-caminhoes"></div>
                    </div>
                    
                    <div class="form-section">
                        <h3><i class="ph ph-users-three"></i> Cadastro de Frentes</h3>
                        <form id="form-frente">
                            <input type="text" id="frente-nome" placeholder="Nome da Frente (Ex: Frente 01)" required>
                            <button type="submit">Salvar Frente</button>
                        </form>
                        <div class="list-container" id="lista-frentes"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
</body>
</html>
