<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teste Mínimo do Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* CSS Básico para garantir que o mapa tenha tamanho */
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Coordenadas da Usina
        const usinaCoords = [-17.642301, -40.181525];

        // Inicializa o mapa
        const map = L.map('map').setView(usinaCoords, 14);

        // Tenta carregar o mapa de satélite do Google (alternativa robusta)
        L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Map data &copy; Google'
        }).addTo(map);

        // Adiciona um marcador
        L.marker(usinaCoords).addTo(map).bindPopup('A Usina aparece aqui?');
    </script>
</body>
</html>
